# Runs on every push and pull request. A red check means something is broken
# before it reaches production. Same checks you can run locally (see CLAUDE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (style + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, sqlite3, pdo_sqlite, gd, intl, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Known vulnerabilities in PHP packages
        run: composer audit --abandoned=report

      - name: Tests
        run: php artisan test

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Known vulnerabilities in npm packages (high or worse)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      # Next.js writes some global types (LayoutProps, PageProps) into .next/;
      # a fresh checkout has none, so generate them before type-checking.
      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build
        run: npm run build
